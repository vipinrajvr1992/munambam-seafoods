<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me; upgrade-insecure-requests;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Product | Munambam Seafoods</title>
<meta name="description" content="Premium coastal provisions from Munambam Harbour.">
<link rel="icon" type="image/x-icon" href="/assets/icon/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --navy:#061b3a;--navy-2:#09274d;--blue:#168dcc;--light-blue:#8ed8f5;
  --gold:#c69a3a;--gold-light:#e0bc68;--cream:#fffaf0;--cream-2:#f7f0df;
  --white:#fff;--text:#142943;--muted:#687d95;--max:1180px;
  --shadow:0 24px 60px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  font-family:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
  color:var(--text);background:var(--navy);overflow-x:hidden;cursor:none;
}
a,button,input,select,textarea{cursor:none!important;font:inherit}
img{max-width:100%}

#fish-cursor{
  position:fixed;left:0;top:0;width:44px;height:27px;
  pointer-events:none;z-index:99999;transform:translate3d(-6px,-14px,0);
}
#fish-cursor svg{display:block;width:44px;height:27px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}

.ocean-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wave-decoration{position:absolute;left:0;top:0;width:100%;height:180px;opacity:.12}
.wave-decoration svg{width:100%;height:100%;display:block}
.wave-decoration path{fill:var(--light-blue)}

nav{
  position:sticky;top:16px;z-index:5000;
  width:min(calc(100% - 32px),1240px);margin:16px auto 0;
  min-height:72px;padding:10px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:rgba(255,250,240,.97);border:1px solid rgba(255,255,255,.86);
  border-radius:50px;box-shadow:0 15px 40px rgba(0,0,0,.20);backdrop-filter:blur(14px);
}
.logo-container{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.logo-container img{width:48px;height:48px;object-fit:contain}
.brand-name{color:var(--navy);font-family:"Space Grotesk",sans-serif;font-size:1.08rem;font-weight:700;letter-spacing:-.4px;white-space:nowrap}
.nav-links{display:flex;align-items:center;gap:25px}
.nav-links a{position:relative;color:var(--navy);text-decoration:none;font-size:.88rem;font-weight:700;padding:10px 0}
.nav-links a::after{content:"";position:absolute;left:0;bottom:3px;width:0;height:2px;background:var(--gold);transition:width .2s}
.nav-links a:hover,.nav-links a.active{color:var(--blue)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.cart-link{
  position:relative;width:46px;height:46px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--navy);background:rgba(6,27,58,.06);border:1px solid rgba(198,154,58,.22);
  text-decoration:none;transition:.2s;flex:0 0 auto;
}
.cart-link:hover{background:var(--gold);transform:translateY(-2px)}
.cart-count{
  position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;
  display:grid;place-items:center;border-radius:20px;background:var(--blue);color:#fff;
  font-size:.64rem;font-weight:800;border:2px solid var(--cream);
}

.page{position:relative;z-index:2;width:min(calc(100% - 32px),var(--max));margin:0 auto;padding:40px 0 90px}
.breadcrumbs{display:flex;align-items:center;gap:9px;color:#a9bfd3;font-size:.76rem;font-weight:650;margin:0 0 22px;flex-wrap:wrap}
.breadcrumbs a{color:var(--light-blue);text-decoration:none}
.breadcrumbs i{font-size:.62rem;color:#68829b}

.product-layout{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:28px;align-items:start;
}
.panel{
  background:linear-gradient(135deg,rgba(255,250,240,.98),rgba(247,240,223,.94));
  border:1px solid rgba(255,255,255,.65);border-radius:28px;box-shadow:var(--shadow);
}
.media-panel{padding:22px;text-align:center}
.media-panel img{
  width:100%;max-height:420px;object-fit:contain;border-radius:20px;
  background:linear-gradient(180deg,#edf6fa,#e5f1f6);padding:24px;
}
.detail-panel{padding:28px 30px 32px}
.eyebrow{color:var(--blue);font-size:.68rem;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;margin:0 0 8px}
.detail-panel h1{
  margin:0;color:var(--navy);font-family:"Space Grotesk",sans-serif;
  font-size:clamp(1.6rem,3.5vw,2.35rem);line-height:1.15;letter-spacing:-.8px;
}
.detail-desc{margin:12px 0 0;color:#65798e;font-size:.88rem;line-height:1.7}
.rating-row{display:flex;align-items:center;gap:8px;margin-top:14px;color:#f4b400;font-size:.9rem}
.rating-row .count{color:#718398;font-size:.72rem;font-weight:700}

.price-block{margin-top:22px;padding:16px 18px;border-radius:16px;background:rgba(198,154,58,.08);border:1px solid rgba(198,154,58,.18)}
.price-block .label{color:#718398;font-size:.68rem;font-weight:700}
.price-block .amount{color:var(--navy);font-family:"Space Grotesk",sans-serif;font-size:1.85rem;font-weight:700;margin-top:2px}
.price-block .gst{color:#8392a3;font-size:.68rem;margin-top:4px}

.field-label{display:block;margin:20px 0 8px;color:var(--navy);font-size:.72rem;font-weight:800}
.pack-options{display:flex;flex-wrap:wrap;gap:10px}
.pack-btn{
  min-height:42px;padding:0 16px;border-radius:50px;
  border:1px solid rgba(6,27,58,.14);background:#fffdf7;color:var(--navy);
  font-size:.78rem;font-weight:750;transition:.2s;
}
.pack-btn:hover{border-color:var(--gold)}
.pack-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.qty-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.qty-box{
  display:flex;align-items:center;border:1px solid rgba(6,27,58,.14);
  border-radius:50px;overflow:hidden;background:#fffdf7;
}
.qty-box button{width:40px;height:40px;border:0;background:transparent;color:var(--navy);font-weight:800;font-size:1rem}
.qty-box button:hover{background:var(--cream-2)}
.qty-box span{min-width:36px;text-align:center;color:var(--navy);font-weight:800;font-size:.85rem}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{
  min-height:50px;padding:0 22px;border:0;border-radius:50px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-size:.8rem;font-weight:800;text-decoration:none;transition:.22s;
}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-2px)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--blue);transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--navy);border:1px solid rgba(6,27,58,.15)}
.btn-outline:hover{border-color:var(--gold);background:rgba(198,154,58,.06)}

.features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.feature-chip{
  padding:12px 14px;border-radius:14px;background:rgba(22,141,204,.06);
  border:1px solid rgba(22,141,204,.1);color:#52677f;font-size:.72rem;font-weight:650;line-height:1.45;
}
.feature-chip i{color:var(--blue);margin-right:6px}

.not-found{text-align:center;padding:70px 20px}
.not-found h2{margin:0;color:var(--navy);font-family:"Space Grotesk",sans-serif}
.not-found p{color:#718398;font-size:.86rem;line-height:1.7}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  z-index:12000;padding:12px 18px;border-radius:50px;
  background:var(--navy);color:#fff;font-size:.78rem;font-weight:700;
  box-shadow:0 16px 40px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Hamburger + drawer */
.nav-toggle{
  display:none;position:relative;width:42px;height:42px;flex:0 0 42px;
  align-items:center;justify-content:center;margin:0;padding:0;
  border:1px solid rgba(198,154,58,.22);border-radius:50%;
  background:rgba(6,27,58,.06);color:var(--navy);z-index:5100;
}
.nav-toggle:hover{background:var(--gold);border-color:var(--gold)}
.nav-toggle-bars{display:block;width:18px;height:14px;position:relative}
.nav-toggle-bars span{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;transition:.28s}
.nav-toggle-bars span:nth-child(1){top:0}
.nav-toggle-bars span:nth-child(2){top:6px}
.nav-toggle-bars span:nth-child(3){top:12px}
.nav-toggle[aria-expanded="true"] .nav-toggle-bars span:nth-child(1){top:6px;transform:rotate(45deg)}
.nav-toggle[aria-expanded="true"] .nav-toggle-bars span:nth-child(2){opacity:0}
.nav-toggle[aria-expanded="true"] .nav-toggle-bars span:nth-child(3){top:6px;transform:rotate(-45deg)}
.nav-drawer-backdrop{
  position:fixed;inset:0;z-index:6000;background:rgba(6,27,58,.55);
  backdrop-filter:blur(4px);opacity:0;visibility:hidden;pointer-events:none;transition:.28s;
}
.nav-drawer-backdrop.is-open{opacity:1;visibility:visible;pointer-events:auto}
.nav-drawer{
  position:fixed;top:0;right:0;z-index:6100;width:min(320px,86vw);height:100%;height:100dvh;
  background:linear-gradient(165deg,rgba(255,250,240,.98),rgba(247,240,223,.96));
  border-left:1px solid rgba(255,255,255,.7);box-shadow:-18px 0 50px rgba(0,0,0,.28);
  transform:translate3d(105%,0,0);transition:transform .32s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden;visibility:hidden;
}
.nav-drawer.is-open{transform:translate3d(0,0,0);visibility:visible}
.nav-drawer-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;border-bottom:1px solid rgba(198,154,58,.18)}
.nav-drawer-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-size:.95rem;font-weight:800}
.nav-drawer-brand img{width:40px;height:40px;object-fit:contain}
.nav-drawer-close{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(198,154,58,.22);border-radius:50%;background:rgba(6,27,58,.06);color:var(--navy)}
.nav-drawer-links{flex:1;overflow-y:auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:4px}
.nav-drawer-links a{display:flex;align-items:center;min-height:48px;padding:12px 16px;border-radius:14px;text-decoration:none;color:var(--navy);font-size:.95rem;font-weight:700}
.nav-drawer-links a:hover{background:rgba(6,27,58,.07);color:var(--blue)}
.nav-drawer-links a.active{background:rgba(198,154,58,.14);box-shadow:inset 3px 0 0 var(--gold)}
.nav-drawer-footer{padding:14px 18px 22px;border-top:1px solid rgba(198,154,58,.18)}
.nav-drawer-cart{
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;
  border-radius:50px;background:var(--gold);color:var(--navy);text-decoration:none;font-size:.9rem;font-weight:800;
}
body.nav-drawer-open{overflow:hidden}
@media(min-width:851px){.nav-toggle,.nav-drawer,.nav-drawer-backdrop{display:none!important}}
@media(max-width:850px){.nav-links{display:none!important}.nav-toggle{display:inline-flex!important}}
@media(max-width:900px){.product-layout{grid-template-columns:1fr}}
@media(max-width:700px){
  body{cursor:auto}a,button,input,select,textarea{cursor:pointer!important}
  #fish-cursor{display:none}
  nav{width:calc(100% - 20px);top:10px;margin-top:10px;min-height:62px;padding:8px 12px;border-radius:28px}
  .brand-name{font-size:.88rem}.logo-container img{width:42px;height:42px}
  .page{width:calc(100% - 24px);padding:28px 0 65px}
  .detail-panel{padding:22px 18px}
  .features{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="fish-cursor" aria-hidden="true">
  <svg fill="none" stroke="#e0bc68" stroke-linecap="round" stroke-width="2" viewBox="0 0 50 30">
    <path d="M5 15 Q25 -5 45 25 M5 15 Q25 35 45 5"></path>
  </svg>
</div>
<div class="ocean-layer" id="oceanLayer" aria-hidden="true">
  <div class="wave-decoration">
    <svg preserveAspectRatio="none" viewBox="0 0 1440 180">
      <path d="M0 95 C180 20 300 165 480 95 S780 20 960 95 S1260 165 1440 95 V0 H0 Z"></path>
    </svg>
  </div>
</div>

<nav aria-label="Main navigation">
  <a href="/" class="logo-container" aria-label="Munambam Seafoods Home">
    <img src="/assets/MUNAMBAM_Seafood_Logo_HQ.png" alt="Munambam Seafoods" width="44" height="44">
    <span class="brand-name">MUNAMBAM SEAFOODS</span>
  </a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/products/" class="active" aria-current="page">Products</a>
    <a href="/about/">About Us</a>
    <a href="/contact/">Contact</a>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/terms/">Terms</a>
  </div>
  <a href="/products/cart.html" class="cart-link" aria-label="Shopping cart">
    <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
    <span class="cart-count" id="cartCount">0</span>
  </a>
  <button type="button" class="nav-toggle" id="navToggle" aria-label="Open menu" aria-controls="navDrawer" aria-expanded="false">
    <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
  </button>
</nav>

<div class="nav-drawer-backdrop" id="navDrawerBackdrop" hidden></div>
<aside class="nav-drawer" id="navDrawer" role="dialog" aria-modal="true" aria-label="Site menu" hidden>
  <div class="nav-drawer-header">
    <a href="/" class="nav-drawer-brand"><img src="/assets/MUNAMBAM_Seafood_Logo_HQ.png" alt="" width="40" height="40"><span>MUNAMBAM SEAFOODS</span></a>
    <button type="button" class="nav-drawer-close" id="navDrawerClose" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="18" height="18"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="nav-drawer-links" aria-label="Mobile navigation">
    <a href="/">Home</a>
    <a href="/products/" class="active">Products</a>
    <a href="/about/">About Us</a>
    <a href="/contact/">Contact</a>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/terms/">Terms</a>
  </nav>
  <div class="nav-drawer-footer">
    <a href="/products/cart.html" class="nav-drawer-cart"><i class="fa-solid fa-bag-shopping"></i> Shopping Cart</a>
  </div>
</aside>

<main class="page">
  <div class="breadcrumbs">
    <a href="/products/">Products</a>
    <i class="fa-solid fa-chevron-right"></i>
    <span id="crumbName">Product</span>
  </div>

  <div id="productRoot"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const CART_KEY = "munambam_cart";

  const CATALOG = {
    "cleaned-dried-prawns": {
      id: "cleaned-dried-prawns",
      name: "Cleaned Dried Prawns",
      category: "prawns",
      desc: "100% meat weight, low sodium and chemical free. Hygienically prepared coastal prawns from Munambam Harbour.",
      image: "./PRODUCT_1.webp",
      rating: 4.9,
      reviews: 87,
      gstRate: 5,
      packs: [
        { label: "100g", price: 200 },
        { label: "250g", price: 480 },
        { label: "500g", price: 920 }
      ]
    },
    "whole-dried-prawns": {
      id: "whole-dried-prawns",
      name: "Whole Dried Prawns",
      category: "prawns",
      desc: "Hygienically dried whole prawns direct from Munambam Harbour. Natural flavour for traditional Kerala cooking.",
      image: "./PRODUCT_2.webp",
      rating: 4.8,
      reviews: 64,
      gstRate: 5,
      packs: [
        { label: "100g", price: 120 },
        { label: "250g", price: 280 },
        { label: "500g", price: 540 }
      ]
    },
    "prawn-chammanthi-podi": {
      id: "prawn-chammanthi-podi",
      name: "Prawn Chammanthi Podi",
      category: "podi",
      desc: "Authentic Kerala homemade prawn chammanthi podi blend — ready to mix and serve with rice or kanji.",
      image: "./PRODUCT_3.webp",
      rating: 4.9,
      reviews: 112,
      gstRate: 5,
      packs: [
        { label: "100g", price: 80 },
        { label: "250g", price: 190 },
        { label: "500g", price: 360 }
      ]
    },
    "premium-dried-shark": {
      id: "premium-dried-shark",
      name: "Premium Dried Shark",
      category: "fish",
      desc: "Premium dried shark prepared with coastal care. Protein-rich and ideal for traditional recipes.",
      image: "./PRODUCT_4.webp",
      rating: 4.8,
      reviews: 53,
      gstRate: 5,
      packs: [
        { label: "100g", price: 140 },
        { label: "250g", price: 330 },
        { label: "500g", price: 640 }
      ]
    },
    "premium-dried-tuna": {
      id: "premium-dried-tuna",
      name: "Premium Dried Tuna",
      category: "fish",
      desc: "Premium dried tuna from Munambam waters. Clean process, natural taste, chemical free.",
      image: "./PRODUCT_5.webp",
      rating: 4.9,
      reviews: 78,
      gstRate: 5,
      packs: [
        { label: "100g", price: 120 },
        { label: "250g", price: 285 },
        { label: "500g", price: 550 }
      ]
    },
    "premium-dried-mackerel": {
      id: "premium-dried-mackerel",
      name: "Premium Dried Mackerel",
      category: "fish",
      desc: "Premium dried mackerel prepared for everyday coastal cooking. Hygienic and naturally flavourful.",
      image: "./PRODUCT_6.webp",
      rating: 4.8,
      reviews: 91,
      gstRate: 5,
      packs: [
        { label: "100g", price: 100 },
        { label: "250g", price: 240 },
        { label: "500g", price: 460 }
      ]
    }
  };

  const $ = (id) => document.getElementById(id);

  function money(n) {
    return "₹" + Number(n || 0).toLocaleString("en-IN");
  }

  function readCart() {
    try {
      const v = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
      return Array.isArray(v) ? v : [];
    } catch {
      return [];
    }
  }

  function writeCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartCount();
  }

  function updateCartCount() {
    const badge = $("cartCount");
    if (!badge) return;
    const count = readCart().reduce((s, i) => s + Math.max(1, Number(i.quantity) || 1), 0);
    badge.textContent = count > 99 ? "99+" : String(count);
  }

  function showToast(msg) {
    const t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function getId() {
    const q = new URLSearchParams(window.location.search);
    return (q.get("id") || "").trim().toLowerCase();
  }

  function render() {
    const id = getId();
    const product = CATALOG[id];
    const root = $("productRoot");
    const crumb = $("crumbName");

    if (!product) {
      if (crumb) crumb.textContent = "Not found";
      document.title = "Product not found | Munambam Seafoods";
      root.innerHTML = `
        <div class="panel not-found">
          <h2>Product not found</h2>
          <p>This product is unavailable or the link is incorrect.</p>
          <p style="margin-top:18px">
            <a class="btn btn-navy" href="/products/">Back to Products</a>
          </p>
        </div>`;
      return;
    }

    if (crumb) crumb.textContent = product.name;
    document.title = product.name + " | Munambam Seafoods";

    let packIndex = 0;
    let qty = 1;

    root.innerHTML = `
      <div class="product-layout">
        <div class="panel media-panel">
          <img id="productImage" src="${product.image}" alt="${product.name}" width="480" height="480">
        </div>
        <div class="panel detail-panel">
          <p class="eyebrow">${product.category}</p>
          <h1>${product.name}</h1>
          <p class="detail-desc">${product.desc}</p>
          <div class="rating-row" aria-label="${product.rating} star rating">
            <span>${"★".repeat(Math.floor(product.rating))}${(product.rating % 1) >= 0.5 ? "☆" : ""}</span>
            <span class="count">${product.rating.toFixed(1)} (${product.reviews})</span>
          </div>

          <div class="price-block">
            <div class="label">Price</div>
            <div class="amount" id="priceAmount">${money(product.packs[0].price)}</div>
            <div class="gst">+ applicable GST (${product.gstRate}%)</div>
          </div>

          <label class="field-label">Pack size</label>
          <div class="pack-options" id="packOptions"></div>

          <label class="field-label">Quantity</label>
          <div class="qty-row">
            <div class="qty-box">
              <button type="button" id="qtyMinus" aria-label="Decrease">−</button>
              <span id="qtyValue">1</span>
              <button type="button" id="qtyPlus" aria-label="Increase">+</button>
            </div>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-gold" id="addCartBtn">
              <i class="fa-solid fa-bag-shopping"></i> Add to Cart
            </button>
            <a class="btn btn-navy" href="/products/cart.html">Go to Cart</a>
            <a class="btn btn-outline" href="/products/">All Products</a>
          </div>

          <div class="features">
            <div class="feature-chip"><i class="fa-solid fa-leaf"></i> Chemical free</div>
            <div class="feature-chip"><i class="fa-solid fa-droplet"></i> Low sodium</div>
            <div class="feature-chip"><i class="fa-solid fa-shield-halved"></i> Hygienically prepared</div>
            <div class="feature-chip"><i class="fa-solid fa-anchor"></i> Munambam Harbour</div>
          </div>
        </div>
      </div>`;

    const packBox = $("packOptions");
    product.packs.forEach((pack, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pack-btn" + (i === 0 ? " active" : "");
      btn.textContent = pack.label + " · " + money(pack.price);
      btn.addEventListener("click", () => {
        packIndex = i;
        packBox.querySelectorAll(".pack-btn").forEach((b, j) => b.classList.toggle("active", j === i));
        $("priceAmount").textContent = money(product.packs[packIndex].price);
      });
      packBox.appendChild(btn);
    });

    $("qtyMinus").addEventListener("click", () => {
      qty = Math.max(1, qty - 1);
      $("qtyValue").textContent = String(qty);
    });
    $("qtyPlus").addEventListener("click", () => {
      qty = Math.min(99, qty + 1);
      $("qtyValue").textContent = String(qty);
    });

    $("addCartBtn").addEventListener("click", () => {
      const pack = product.packs[packIndex];
      const cart = readCart();
      const existing = cart.findIndex(
        (item) => item.id === product.id && item.pack === pack.label
      );

      if (existing >= 0) {
        cart[existing].quantity = Math.max(1, Number(cart[existing].quantity) || 1) + qty;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          pack: pack.label,
          price: pack.price,
          quantity: qty,
          image: product.image,
          gstRate: product.gstRate
        });
      }

      writeCart(cart);
      showToast("Added to cart");
    });
  }

  updateCartCount();
  window.addEventListener("storage", (e) => {
    if (e.key === CART_KEY) updateCartCount();
  });
  render();

  /* cursor */
  const cursor = $("fish-cursor");
  const fine = window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  if (cursor && fine) {
    let x = 0, y = 0, raf = false;
    document.addEventListener("mousemove", (e) => {
      x = e.clientX; y = e.clientY;
      if (raf) return; raf = true;
      requestAnimationFrame(() => {
        cursor.style.transform = `translate3d(${x - 6}px,${y - 14}px,0)`;
        raf = false;
      });
    }, { passive: true });
  }

  /* hamburger */
  const navToggle = $("navToggle");
  const navDrawer = $("navDrawer");
  const navBackdrop = $("navDrawerBackdrop");
  const navClose = $("navDrawerClose");

  function openNav() {
    if (!navDrawer || !navToggle) return;
    navDrawer.hidden = false;
    if (navBackdrop) navBackdrop.hidden = false;
    requestAnimationFrame(() => {
      navDrawer.classList.add("is-open");
      if (navBackdrop) navBackdrop.classList.add("is-open");
    });
    navToggle.setAttribute("aria-expanded", "true");
    document.body.classList.add("nav-drawer-open");
  }
  function closeNav() {
    if (!navDrawer || !navToggle) return;
    navDrawer.classList.remove("is-open");
    if (navBackdrop) navBackdrop.classList.remove("is-open");
    navToggle.setAttribute("aria-expanded", "false");
    document.body.classList.remove("nav-drawer-open");
    setTimeout(() => {
      navDrawer.hidden = true;
      if (navBackdrop) navBackdrop.hidden = true;
    }, 320);
  }
  if (navToggle && navDrawer) {
    navToggle.addEventListener("click", () => {
      navToggle.getAttribute("aria-expanded") === "true" ? closeNav() : openNav();
    });
    if (navClose) navClose.addEventListener("click", closeNav);
    if (navBackdrop) navBackdrop.addEventListener("click", closeNav);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeNav();
    });
    navDrawer.querySelectorAll("a").forEach((a) => a.addEventListener("click", closeNav));
  }
})();
</script>
</body>
</html>
