<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Munambam Seafoods | Coastal Provisions & Heritage</title>
    <meta name="description" content="Order 100% authentic Munambam protein-rich, fresh fish, premium hygienically dried fish, and dried prawns online.">
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-light: #e0f2fe;
            --primary-blue: #0284c7;
            --dark-ocean: #071e3d;
            --deep-navy: #0b2545;
            --accent-gold: #d4af37;
            --white: #ffffff;
            --card-shadow: 0 20px 40px rgba(2, 132, 199, 0.08);
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        /* Desktop Cursor Reset */
        @media (min-width: 1025px) {
            body, a, button, input {
                cursor: none !important;
            }
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 50%, #e0f2fe 100%);
            color: #1e293b;
            overflow-x: hidden;
            position: relative;
        }

        /* --------------------------------------------------
           BACKGROUND ANIMATIONS: MOVING FISH (BOTH SIDES)
        -------------------------------------------------- */
        .ocean-bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-creature {
            position: absolute;
            opacity: 0.65;
        }

        /* Sizes */
        .size-s { width: 45px; }
        .size-m { width: 80px; }
        .size-l { width: 140px; }
        .size-xl { width: 200px; }

        /* Left to Right Movement */
        .ltr { animation: floatLTR linear infinite; }
        /* Right to Left Movement */
        .rtl { animation: floatRTL linear infinite; }

        /* Timings & Positions */
        .ent-1 { top: 15%; animation-duration: 35s; }
        .ent-2 { top: 40%; animation-duration: 25s; animation-delay: 5s; }
        .ent-3 { top: 65%; animation-duration: 40s; animation-delay: 2s; }
        .ent-4 { top: 80%; animation-duration: 28s; animation-delay: 12s; }
        .ent-5 { top: 25%; animation-duration: 45s; animation-delay: 8s; }
        .ent-6 { top: 55%; animation-duration: 32s; animation-delay: 15s; }

        /* Animation: Left to Right (Face Right scaleX(1)) */
        @keyframes floatLTR {
            0% { left: -300px; transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-30px) scaleX(1); }
            100% { left: 110vw; transform: translateY(0px) scaleX(1); }
        }

        /* Animation: Right to Left (Face Left scaleX(-1)) */
        @keyframes floatRTL {
            0% { left: 110vw; transform: translateY(0px) scaleX(-1); }
            50% { transform: translateY(30px) scaleX(-1); }
            100% { left: -300px; transform: translateY(0px) scaleX(-1); }
        }

        /* Seaweed / Plants at bottom */
        .seaweed {
            position: absolute;
            bottom: 0;
            opacity: 0.25;
            transform-origin: bottom center;
            animation: sway ease-in-out infinite alternate;
        }
        .seaweed-1 { left: 5%; animation-duration: 4s; transform: scale(1); }
        .seaweed-2 { left: 25%; animation-duration: 5s; transform: scale(0.8); }
        .seaweed-3 { right: 25%; animation-duration: 4.5s; transform: scale(1.2); }
        .seaweed-4 { right: 5%; animation-duration: 5.5s; transform: scale(0.9); }

        @keyframes sway {
            0% { transform: rotate(-6deg) scale(inherit); }
            100% { transform: rotate(6deg) scale(inherit); }
        }

        /* --------------------------------------------------
           NAVIGATION & UI
        -------------------------------------------------- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-name {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--dark-ocean);
            letter-spacing: -0.5px;
        }

        .nav-links a {
            text-decoration: none;
            color: #334155;
            margin-left: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover { color: var(--primary-blue); }

        /* HERO SECTION */
        .hero-container {
            position: relative;
            padding: 60px 8% 100px 8%;
            text-align: center;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            background: rgba(2, 132, 199, 0.1);
            color: var(--primary-blue);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 3.8rem;
            font-weight: 700;
            color: var(--dark-ocean);
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--primary-blue);
            font-weight: 600;
            margin-bottom: 35px;
        }

        .main-showcase {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 30px 0 50px 0;
        }

        .product-3d-box {
            position: relative;
            max-width: 400px;
            width: 85%;
            filter: drop-shadow(0 30px 40px rgba(7, 30, 61, 0.25));
        }

        .product-3d-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-order {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary-blue);
            color: var(--white);
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 12px 25px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }

        .btn-whatsapp {
            background: #10b981;
            box-shadow: 0 12px 25px rgba(16, 185, 129, 0.35);
        }

        .btn-whatsapp:hover {
            background: #059669;
            transform: translateY(-3px);
        }
        
        @media (max-width: 768px) {
            .hero-title { font-size: 2.5rem; }
            .hero-subtitle { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Ocean Background Elements -->
    <div class="ocean-bg-elements">
        
        <!-- Moving Sea Creatures (Using Your Provided PNG Names) -->
        <!-- LTR = Left To Right | RTL = Right To Left -->
        
        <img src="shark.png" class="bg-creature size-l ent-1 ltr" alt="Shark LTR">
        <img src="shark (1).png" class="bg-creature size-m ent-2 rtl" alt="Shark Outline RTL">
        <img src="octopus.png" class="bg-creature size-s ent-3 ltr" alt="Octopus LTR">
        <img src="shark.png" class="bg-creature size-xl ent-4 rtl" alt="Shark RTL">
        <img src="shark (1).png" class="bg-creature size-s ent-5 ltr" alt="Shark Outline LTR">
        <img src="octopus.png" class="bg-creature size-m ent-6 rtl" alt="Octopus RTL">

        <!-- Seaweed Plants -->
        <svg class="seaweed seaweed-1" width="80" height="180" viewBox="0 0 100 200" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round">
            <path d="M 20,200 Q 40,150 10,100 T 30,0" />
            <path d="M 50,200 Q 70,140 40,80 T 60,10" />
        </svg>
        <svg class="seaweed seaweed-2" width="60" height="140" viewBox="0 0 100 200" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round">
            <path d="M 50,200 Q 20,150 40,100 T 20,0" />
            <path d="M 80,200 Q 90,140 60,80 T 80,10" />
        </svg>
        <svg class="seaweed seaweed-3" width="90" height="160" viewBox="0 0 100 200" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round">
            <path d="M 30,200 Q 50,150 20,100 T 40,0" />
            <path d="M 60,200 Q 80,140 50,80 T 70,10" />
        </svg>
        <svg class="seaweed seaweed-4" width="75" height="190" viewBox="0 0 100 200" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round">
            <path d="M 20,200 Q 40,150 10,100 T 30,0" />
            <path d="M 50,200 Q 70,140 40,80 T 60,10" />
        </svg>
    </div>

    <!-- Header Navigation -->
    <nav>
        <div class="logo-container">
            <!-- Ensure your logo is in the assets folder or update path -->
            <img src="assets/MUNAMBAM_Seafood_Logo_HQ.png" alt="Logo" style="height: 48px;">
            <span class="brand-name">MUNAMBAM SEAFOODS</span>
        </div>
        <div class="nav-links">
            <a href="#products">Products</a>
            <a href="#heritage">Heritage</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-container">
        <span class="badge">100% Hygienically Dried & Chemical Free</span>
        <h1 class="hero-title">PREMIUM SEA FOOD</h1>
        <div class="hero-subtitle">Authentic Taste Direct From Harbour</div>

        <div class="main-showcase">
            <div class="product-3d-box">
                <!-- Ensure your product image is in the assets folder or update path -->
                <img src="assets/PRODUCT_PACK_FRONT.png" alt="Munambam Dried Prawns">
            </div>
        </div>

        <a href="https://wa.me/917907804747" class="btn-order btn-whatsapp"><i class="fab fa-whatsapp"></i> Order Now via WhatsApp</a>
    </section>

    <!-- Interactive Custom Cursor Script -->
    <script>
        if (window.innerWidth > 1024) {
            const fishCursor = document.createElement('div');
            fishCursor.id = 'fish-cursor';

            // Using shark.png as the cursor
            fishCursor.innerHTML = `<img src="shark.png" id="cursor-img" alt="Cursor" style="width: 45px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.3)); pointer-events: none; transition: transform 0.15s ease;">`;

            document.body.appendChild(fishCursor);

            const style = document.createElement('style');
            style.innerHTML = `
                #fish-cursor {
                    position: fixed;
                    pointer-events: none;
                    z-index: 9999;
                    transform: translate(-10px, -20px);
                }
            `;
            document.head.appendChild(style);

            let lastX = 0;
            const cursorImg = document.getElementById('cursor-img');

            document.addEventListener('mousemove', (e) => {
                // Move cursor container
                fishCursor.style.left = e.clientX + 'px';
                fishCursor.style.top = e.clientY + 'px';
                
                // Flip image based on direction (Right = scaleX(1), Left = scaleX(-1))
                if (e.clientX > lastX) {
                    cursorImg.style.transform = 'scaleX(1)';
                } else if (e.clientX < lastX) {
                    cursorImg.style.transform = 'scaleX(-1)';
                }
                lastX = e.clientX;
            });
        }
    </script>
</body>
</html>
