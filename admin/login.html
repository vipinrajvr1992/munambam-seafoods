<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Cache-Control" content="no-store">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   base-uri 'self';
                   object-src 'none';
                   frame-ancestors 'none';
                   form-action 'self';
                   img-src 'self' data: https:;
                   style-src 'self' 'unsafe-inline';
                   script-src 'self' https://cdn.jsdelivr.net;
                   connect-src 'self' https://ydfsglzcacagkofyefcd.supabase.co wss://ydfsglzcacagkofyefcd.supabase.co;
                   font-src 'self' data:;
                   media-src 'self';
                   upgrade-insecure-requests">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy"
          content="camera=(), microphone=(), geolocation=(), payment=(self), usb=(), serial=(), bluetooth=()">
    <title>Admin Login | Munambam Seafoods</title>

    <link rel="icon" href="/assets/icon/favicon.ico">
    <link rel="stylesheet" href="./assets/admin.css">
</head>
<body>
    <main class="admin-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand">
                <img
                    src="/assets/MUNAMBAM_Seafood_Logo_HQ.png"
                    alt="Munambam Seafoods"
                    width="76"
                    height="76"
                >
                <div class="badge">Secure Admin</div>
                <h1 id="loginTitle">Munambam Seafoods</h1>
                <p>Administration Portal</p>
            </div>

            <div id="authMessage" class="auth-message error" role="alert" hidden></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input
                        class="form-control"
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="username"
                        required
                        placeholder="admin@example.com"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input
                            class="form-control"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            placeholder="Enter your password"
                        >
                        <button
                            class="password-toggle"
                            id="togglePassword"
                            type="button"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                </div>

                <button class="login-button" id="loginButton" type="submit">
                    <span class="button-text">Sign in</span>
                </button>
            </form>

            <p class="security-note">
                Access is verified through Supabase Auth and the
                server-side admin authorization table. Unauthorized
                accounts are rejected before entering the dashboard.
            </p>
        </section>
    </main>

    <!-- Supabase public client library. Never replace this with a service-role key. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/config.js"></script>
    <script src="./assets/admin-auth.js"></script>
</body>
</html>
